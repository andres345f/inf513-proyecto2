name: Desplegar frontend a TecnoWeb (FTP)

# Los pushes a main despliegan el frontend. La ejecución manual conserva una
# opción dry_run activada por defecto para poder simular sin modificar el servidor.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simular sin subir ni borrar archivos
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Impide que dos despliegues FTP escriban al mismo tiempo.
concurrency:
  group: produccion-frontend-ftp
  cancel-in-progress: false

env:
  URL_PUBLICA: https://mail.tecnoweb.org.bo/inf513/grupo29sa/proyecto2/app/

jobs:
  validar-compilar-desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar rutas de producción
        run: |
          cat > frontend/.env.produccion <<'EOF'
          VITE_API_URL=/inf513/grupo29sa/proyecto2/api
          VITE_BASE=/inf513/grupo29sa/proyecto2/app/
          VITE_BASENAME=/inf513/grupo29sa/proyecto2
          EOF

      - name: Instalar, probar y compilar
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build:produccion

      - name: Verificar el paquete permitido
        run: |
          test -f backend/public/app/index.html
          test -f backend/public/app/preferencias-iniciales.js
          test -d backend/public/app/assets
          test ! -e backend/public/app/.env
          echo "Solo se publicará el contenido de backend/public/app/"
          find backend/public/app -type f | sort

      - name: Desplegar exclusivamente public/app por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./backend/public/app/
          server-dir: ./proyecto2/public/app/
          state-name: .ftp-deploy-frontend-state.json
          # En un push despliega realmente; en ejecución manual respeta la casilla.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          dangerous-clean-slate: false
          log-level: standard
          timeout: 600000

      - name: Verificar la aplicación pública
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          HTML="$(curl --fail --location --retry 3 --retry-delay 2 \
            --silent --show-error "${URL_PUBLICA}")"
          printf '%s' "${HTML}" | grep -q '/inf513/grupo29sa/proyecto2/app/assets/'

      - name: Resumen
        if: always()
        run: |
          {
            echo "### CI/CD del frontend"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Carpeta local permitida: \`backend/public/app/\`"
            echo "- Destino FTP: \`proyecto2/public/app/\`"
            echo "- Evento: \`${GITHUB_EVENT_NAME}\`"
            echo "- Simulación manual: \`${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}\`"
            echo "- Backend, .env, vendor, storage y base de datos: no incluidos"
          } >> "${GITHUB_STEP_SUMMARY}"
