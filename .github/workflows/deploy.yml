name: Desplegar frontend a TecnoWeb (SSH)

# Durante la prueba solo se ejecuta manualmente desde la pestaña Actions.
# Cuando el flujo esté verificado se podrá evaluar agregar un disparador por push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: produccion-frontend
  cancel-in-progress: false

env:
  SSH_HOST: ${{ secrets.TECNOWEB_SSH_HOST }}
  SSH_USER: ${{ secrets.TECNOWEB_SSH_USER }}
  SSH_PORT: ${{ secrets.TECNOWEB_SSH_PORT }}
  URL_PUBLICA: https://mail.tecnoweb.org.bo/inf513/grupo29sa/proyecto2/app/

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar rutas de producción
        run: |
          cat > frontend/.env.produccion <<'EOF'
          VITE_API_URL=/inf513/grupo29sa/proyecto2/api
          VITE_BASE=/inf513/grupo29sa/proyecto2/app/
          VITE_BASENAME=/inf513/grupo29sa/proyecto2
          EOF

      - name: Validar y compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:produccion
          test -f ../backend/public/app/index.html

      - name: Empaquetar exclusivamente public/app
        run: |
          tar -C backend/public -czf "/tmp/feder-frontend-${GITHUB_SHA}.tar.gz" app

      - name: Configurar acceso SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TECNOWEB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TECNOWEB_SSH_KNOWN_HOSTS }}
        run: |
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_PORT}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Transferir el paquete temporal
        run: |
          scp -P "${SSH_PORT}" \
            "/tmp/feder-frontend-${GITHUB_SHA}.tar.gz" \
            "${SSH_USER}@${SSH_HOST}:feder-frontend-${GITHUB_SHA}.tar.gz"

      - name: Activar el frontend con respaldo
        id: activar
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "RELEASE_SHA='${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          readonly APP_DIR="${HOME}/proyecto2"
          readonly PUBLIC_DIR="${APP_DIR}/public"
          readonly CURRENT_DIR="${PUBLIC_DIR}/app"
          readonly NEW_DIR="${PUBLIC_DIR}/app_nueva"
          readonly BACKUP_DIR="${PUBLIC_DIR}/app_anterior"
          readonly ARCHIVE="${HOME}/feder-frontend-${RELEASE_SHA}.tar.gz"
          readonly STAGE_DIR="${HOME}/feder-frontend-${RELEASE_SHA}"

          [[ "${APP_DIR}" == "${HOME}/proyecto2" ]]
          [[ -d "${PUBLIC_DIR}" ]]

          cleanup() {
            rm -rf -- "${STAGE_DIR}" "${ARCHIVE}" "${NEW_DIR}"
          }
          trap cleanup EXIT

          rm -rf -- "${STAGE_DIR}"
          mkdir -p -- "${STAGE_DIR}"
          tar -xzf "${ARCHIVE}" -C "${STAGE_DIR}"
          test -f "${STAGE_DIR}/app/index.html"

          rm -rf -- "${NEW_DIR}"
          mv -- "${STAGE_DIR}/app" "${NEW_DIR}"
          rm -rf -- "${BACKUP_DIR}"

          if [[ -d "${CURRENT_DIR}" ]]; then
            mv -- "${CURRENT_DIR}" "${BACKUP_DIR}"
          fi

          if ! mv -- "${NEW_DIR}" "${CURRENT_DIR}"; then
            if [[ -d "${BACKUP_DIR}" && ! -d "${CURRENT_DIR}" ]]; then
              mv -- "${BACKUP_DIR}" "${CURRENT_DIR}"
            fi
            exit 1
          fi
          REMOTE

      - name: Verificar la aplicación pública
        id: verificar
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --silent --show-error "${URL_PUBLICA}" > /dev/null

      - name: Restaurar el frontend anterior si falla la verificación
        if: failure() && steps.activar.outcome == 'success'
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          readonly PUBLIC_DIR="${HOME}/proyecto2/public"
          readonly CURRENT_DIR="${PUBLIC_DIR}/app"
          readonly BACKUP_DIR="${PUBLIC_DIR}/app_anterior"
          readonly FAILED_DIR="${PUBLIC_DIR}/app_fallida"

          [[ "${PUBLIC_DIR}" == "${HOME}/proyecto2/public" ]]
          test -d "${BACKUP_DIR}"

          rm -rf -- "${FAILED_DIR}"
          if [[ -d "${CURRENT_DIR}" ]]; then
            mv -- "${CURRENT_DIR}" "${FAILED_DIR}"
          fi
          mv -- "${BACKUP_DIR}" "${CURRENT_DIR}"
          rm -rf -- "${FAILED_DIR}"
          REMOTE

      - name: Resumen
        run: |
          {
            echo "### Frontend desplegado"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Destino: \`${URL_PUBLICA}\`"
            echo "- Respaldo remoto: \`~/proyecto2/public/app_anterior\`"
          } >> "${GITHUB_STEP_SUMMARY}"
